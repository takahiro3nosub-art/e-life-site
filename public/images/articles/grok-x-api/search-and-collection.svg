<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Grok APIとX APIの役割の違い</title>
  <desc id="desc">Grok APIがX上の声を探索して論点を整理し、X APIが投稿原文や日時、反応数を正確に収集する流れ</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f8ff"/>
      <stop offset="1" stop-color="#edf7f1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#1c3557" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1600" height="900" rx="48" fill="url(#bg)"/>
  <circle cx="1420" cy="120" r="150" fill="#dbeafe" opacity="0.7"/>
  <circle cx="160" cy="780" r="170" fill="#d9f1e3" opacity="0.8"/>
  <text x="800" y="105" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans JP',sans-serif" font-size="54" font-weight="800" fill="#13243a">「検索・整理」と「正確な収集」は別の仕事</text>
  <text x="800" y="158" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans JP',sans-serif" font-size="26" font-weight="600" fill="#516174">Xリサーチで迷ったときの使い分け</text>
  <g filter="url(#shadow)">
    <rect x="130" y="235" width="570" height="470" rx="36" fill="#ffffff"/>
    <rect x="900" y="235" width="570" height="470" rx="36" fill="#ffffff"/>
  </g>
  <rect x="180" y="285" width="168" height="54" rx="27" fill="#2563eb"/>
  <text x="264" y="321" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans JP',sans-serif" font-size="27" font-weight="800" fill="#ffffff">Grok API</text>
  <text x="180" y="405" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans JP',sans-serif" font-size="43" font-weight="800" fill="#17335d">探す・読む・整理する</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'Noto Sans JP',sans-serif" font-size="29" font-weight="600" fill="#334a68">
    <text x="205" y="485">● 悩みや不満を見つける</text>
    <text x="205" y="545">● 意味の近い投稿を探す</text>
    <text x="205" y="605">● 論点や言い回しを整理する</text>
  </g>
  <rect x="950" y="285" width="135" height="54" rx="27" fill="#16805d"/>
  <text x="1018" y="321" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans JP',sans-serif" font-size="27" font-weight="800" fill="#ffffff">X API</text>
  <text x="950" y="405" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans JP',sans-serif" font-size="43" font-weight="800" fill="#164a3a">条件どおりに収集する</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'Noto Sans JP',sans-serif" font-size="29" font-weight="600" fill="#315a4d">
    <text x="975" y="485">● 投稿原文とIDを取得する</text>
    <text x="975" y="545">● 日時や公開反応数を扱う</text>
    <text x="975" y="605">● 件数を管理して集計する</text>
  </g>
  <path d="M730 430h105" stroke="#718096" stroke-width="14" stroke-linecap="round"/>
  <path d="m820 400 38 30-38 30" fill="none" stroke="#718096" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="795" y="510" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans JP',sans-serif" font-size="24" font-weight="700" fill="#59687a">必要に応じて</text>
  <rect x="410" y="760" width="780" height="78" rx="39" fill="#13243a"/>
  <text x="800" y="811" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans JP',sans-serif" font-size="30" font-weight="800" fill="#ffffff">引用は投稿ID・citation・X側の本文を照合</text>
</svg>
