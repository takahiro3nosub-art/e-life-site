<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="E-Life公式サイトは現在準備中です。" />
    <title>E-Life | 公式サイト準備中</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP",
          sans-serif;
        color: #1d2a25;
        background: #f4f8f5;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at top left, #dcefe3 0, transparent 38%),
          linear-gradient(145deg, #f8fbf9, #edf5f0);
      }

      main {
        width: min(100%, 680px);
        padding: clamp(40px, 8vw, 72px);
        text-align: center;
        background: rgb(255 255 255 / 88%);
        border: 1px solid rgb(58 107 79 / 14%);
        border-radius: 28px;
        box-shadow: 0 24px 70px rgb(42 82 59 / 12%);
      }

      .brand {
        margin: 0 0 24px;
        color: #27724b;
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 7vw, 3.5rem);
        line-height: 1.25;
        letter-spacing: 0.04em;
      }

      p {
        margin: 24px auto 0;
        color: #53635b;
        font-size: 1rem;
        line-height: 1.9;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="brand">E-Life</p>
      <h1>ただいま準備中です</h1>
      <p>
        E-Life公式サイトをご覧いただきありがとうございます。<br />
        公開まで今しばらくお待ちください。
      </p>
    </main>
  </body>
</html>
